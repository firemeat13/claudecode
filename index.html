<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sbalit na dovolenou</title>
<style>
  :root { --bg:#f3f6fa; --card:#fff; --text:#1f2a37; --muted:#6b7785; --accent:#2a8fbd; --done:#9aa5b1; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); }
  main { max-width: 720px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { margin: 0 0 4px; }
  .progress { margin: 12px 0 20px; }
  .bar { height: 12px; background:#dde4ec; border-radius: 6px; overflow:hidden; }
  .bar > div { height:100%; width:0; background:var(--accent); transition: width .25s; }
  .progress small { color:var(--muted); }
  .toolbar { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  button { font:inherit; border:0; border-radius:8px; padding:8px 14px; background:var(--accent); color:#fff; cursor:pointer; }
  button.secondary { background:#e3e9f0; color:var(--text); }
  button.icon { background:none; color:var(--muted); padding:2px 8px; }
  button.icon:hover { color:#c0392b; }
  section { background:var(--card); border-radius:12px; padding:12px 16px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  section h2 { margin:0 0 6px; font-size:1.1rem; display:flex; justify-content:space-between; align-items:center; }
  section h2 span { font-weight:normal; font-size:.85rem; color:var(--muted); }
  ul { list-style:none; margin:0; padding:0; }
  li { display:flex; align-items:center; gap:10px; padding:6px 0; border-top:1px solid #eef2f6; }
  li label { flex:1; cursor:pointer; }
  li input[type=checkbox] { width:20px; height:20px; accent-color:var(--accent); }
  li.done label { text-decoration:line-through; color:var(--done); }
  form.add { display:flex; gap:8px; margin-top:8px; }
  form.add input { flex:1; font:inherit; padding:7px 10px; border:1px solid #cfd8e3; border-radius:8px; }
  .newcat { display:flex; gap:8px; margin-top:20px; }
  .newcat input { flex:1; font:inherit; padding:8px 10px; border:1px solid #cfd8e3; border-radius:8px; }
</style>
</head>
<body>
<main>
  <h1>🧳 Sbalit na dovolenou</h1>
  <div class="progress">
    <div class="bar"><div id="bar"></div></div>
    <small id="progressText"></small>
  </div>
  <div class="toolbar">
    <button class="secondary" id="uncheckAll">Odškrtnout vše</button>
    <button class="secondary" id="reset">Obnovit výchozí seznam</button>
  </div>
  <div id="lists"></div>
  <form class="newcat" id="newCat">
    <input id="newCatName" placeholder="Nová kategorie…" required>
    <button>Přidat kategorii</button>
  </form>
</main>

<script>
const KEY = 'packing-list-v1';
const DEFAULTS = {
  'Oblečení': ['Trička', 'Kalhoty / kraťasy', 'Spodní prádlo', 'Ponožky', 'Plavky', 'Mikina / svetr', 'Pyžamo', 'Bunda do deště', 'Pohodlné boty', 'Sandály / žabky', 'Čepice / klobouk'],
  'Drogerie': ['Zubní kartáček a pasta', 'Šampon a sprchový gel', 'Deodorant', 'Krém na opalování', 'Hřeben / kartáč', 'Holení', 'Kontaktní čočky / roztok', 'Repelent', 'Kapesníky'],
  'Doklady a peníze': ['Občanský průkaz / pas', 'Peníze / platební karta', 'Pojištění (EHIC)', 'Letenky / jízdenky', 'Rezervace ubytování', 'Řidičský průkaz'],
  'Elektronika': ['Mobil a nabíječka', 'Powerbanka', 'Sluchátka', 'Fotoaparát', 'Redukce do zásuvky'],
  'Lékárnička': ['Léky na předpis', 'Léky proti bolesti', 'Náplasti', 'Léky na průjem / žaludek', 'Dezinfekce'],
  'Ostatní': ['Sluneční brýle', 'Ručník', 'Batoh na výlety', 'Láhev na vodu', 'Kniha / čtečka', 'Klíče od bytu']
};

let state = load();

function fromDefaults() {
  return Object.entries(DEFAULTS).map(([name, items]) => ({ name, items: items.map(text => ({ text, done: false })) }));
}
function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || fromDefaults(); }
  catch { return fromDefaults(); }
}
function save() { localStorage.setItem(KEY, JSON.stringify(state)); render(); }

function render() {
  const root = document.getElementById('lists');
  root.innerHTML = '';
  let total = 0, done = 0;

  state.forEach((cat, ci) => {
    const d = cat.items.filter(i => i.done).length;
    total += cat.items.length; done += d;

    const sec = document.createElement('section');
    const h = document.createElement('h2');
    h.innerHTML = `<div></div><span>${d}/${cat.items.length}</span>`;
    h.firstChild.textContent = cat.name;
    const del = document.createElement('button');
    del.className = 'icon'; del.textContent = '🗑'; del.title = 'Smazat kategorii';
    del.onclick = () => { if (confirm(`Smazat kategorii „${cat.name}“?`)) { state.splice(ci, 1); save(); } };
    h.appendChild(del);
    sec.appendChild(h);

    const ul = document.createElement('ul');
    cat.items.forEach((item, ii) => {
      const li = document.createElement('li');
      if (item.done) li.className = 'done';
      const id = `i-${ci}-${ii}`;
      const cb = document.createElement('input');
      cb.type = 'checkbox'; cb.id = id; cb.checked = item.done;
      cb.onchange = () => { item.done = cb.checked; save(); };
      const lb = document.createElement('label');
      lb.htmlFor = id; lb.textContent = item.text;
      const x = document.createElement('button');
      x.className = 'icon'; x.textContent = '✕'; x.title = 'Odebrat';
      x.onclick = () => { cat.items.splice(ii, 1); save(); };
      li.append(cb, lb, x);
      ul.appendChild(li);
    });
    sec.appendChild(ul);

    const form = document.createElement('form');
    form.className = 'add';
    form.innerHTML = '<input placeholder="Přidat věc…" required><button class="secondary">+</button>';
    form.onsubmit = e => {
      e.preventDefault();
      const v = form.querySelector('input').value.trim();
      if (v) { cat.items.push({ text: v, done: false }); save(); }
    };
    sec.appendChild(form);
    root.appendChild(sec);
  });

  const pct = total ? Math.round(done / total * 100) : 0;
  document.getElementById('bar').style.width = pct + '%';
  document.getElementById('progressText').textContent =
    `Sbaleno ${done} z ${total} (${pct} %)` + (total && done === total ? ' – hotovo, šťastnou cestu! 🎉' : '');
}

document.getElementById('newCat').onsubmit = e => {
  e.preventDefault();
  const input = document.getElementById('newCatName');
  const name = input.value.trim();
  if (name) { state.push({ name, items: [] }); input.value = ''; save(); }
};
document.getElementById('uncheckAll').onclick = () => { state.forEach(c => c.items.forEach(i => i.done = false)); save(); };
document.getElementById('reset').onclick = () => {
  if (confirm('Smazat vlastní změny a vrátit výchozí seznam?')) { state = fromDefaults(); save(); }
};

render();
</script>
</body>
</html>
